- concept: "FastAPI 中间层"
  area: "Agent Engineering"
  summary: "把前端直调接口改造成稳定后端边界，负责参数校验、任务创建、状态查询和产物返回。"
- concept: "node-pty 与无头 Agent"
  area: "Agent Engineering"
  summary: "node-pty 适合驱动交互式 CLI，但 Web 服务更需要无头化、结构化输入输出和超时控制。"
- concept: "SSE / JSONL"
  area: "Agent UX"
  summary: "SSE 负责浏览器端单向流式订阅，JSONL 负责生成器向后端持续输出结构化事件。"
- concept: "RunStore / EventStore"
  area: "Coding Agent"
  summary: "Run 记录任务状态，Event 记录过程事实，Artifact 记录生成产物，是 Agent 可观察性的基础。"
- concept: "Patch Loop"
  area: "Coding Agent"
  summary: "生成失败后只把错误摘要和少量相关文件交给模型，要求小范围补丁，再次验证。"
- concept: "OSS / FC / Docker"
  area: "Deployment"
  summary: "OSS 保存产物和静态资源，FC 容器提供运行预览，Docker 统一本地和云端运行环境。"
- concept: "LLM Router 三问"
  area: "LLM Routing"
  summary: "任何路由策略都应先回答：什么时候决策、看什么信号、用什么算法计算。"
- concept: "Semantic Override"
  area: "LLM Routing"
  summary: "默认使用强模型，只在语义上足够确定时降级到小模型，比多路直接分类更稳。"
- concept: "Router Latency"
  area: "LLM Routing"
  summary: "端到端延迟和 router decision latency 不是同一个指标，离线评测不能替代线上延迟验证。"
- concept: "vLLM Semantic Router"
  area: "LLM Routing"
  summary: "它是信号、投影、决策、模型选择和插件组成的流量控制平面，不只是分类器。"
- concept: "RoPE"
  area: "Transformer"
  summary: "把隐藏维度两两成对放进二维平面旋转，用方向关系编码位置并保持向量长度。"
- concept: "Activation Checkpointing"
  area: "Training"
  summary: "训练中用重算换显存，不是保存参数矩阵，而是保存必要边界并在反向时重算激活。"
- concept: "BF16"
  area: "Training"
  summary: "BF16 保留 FP32 的指数范围但减少尾数精度，适合大模型训练和推理中的动态范围需求。"
- concept: "KV Cache / PagedAttention"
  area: "Serving"
  summary: "KV cache 保存历史 token 的 K/V，PagedAttention 用块式管理降低连续显存分配压力。"
- concept: "Tensor Parallel"
  area: "Serving"
  summary: "TP 拆单层计算，ColumnParallelLinear 和 RowParallelLinear 分别对应不同维度切分和通信模式。"
- concept: "FSDP / ZeRO-3"
  area: "Training"
  summary: "FSDP 和 ZeRO-3 主要分片参数、梯度和优化器状态，目标是训练省显存。"
- concept: "Ascend NPU 调度"
  area: "Deployment"
  summary: "NPU 任务失败可能来自镜像、模型兼容、队列配额、CPU/内存请求、HCCL 或共享存储。"
- concept: "CUDA Reduction"
  area: "CUDA"
  summary: "高效规约通常按 thread-local、warp、block、global 层级推进，尽量减少 global memory 访问。"
- concept: "Operator Fusion"
  area: "Triton"
  summary: "融合算子的收益来自减少中间结果写回 global memory，而不是把多个函数简单放在一起。"
- concept: "LayerNorm vs RMSNorm"
  area: "Triton"
  summary: "RMSNorm 只去长度，LayerNorm 同时去均值和长度；这个统计量差异会变成 kernel 成本差异。"

{% include base_path %}

<div class="page__footer-media">
  <video
    class="page__footer-video"
    autoplay
    loop
    muted
    playsinline
    preload="metadata"
    aria-label="Footer video"
  >
    <source src="{{ base_path }}/assets/uv202409.mp4" type="video/mp4">
  </video>
</div>

<script>
  (function() {
    const media = document.querySelector('.page__footer-media');
    const video = document.querySelector('.page__footer-video');

    if (!media || !video) {
      return;
    }

    function syncFooterVideo() {
      if (!video.videoWidth || !video.videoHeight) {
        return;
      }

      const width = media.clientWidth;
      const fullHeight = width * video.videoHeight / video.videoWidth;
      const visibleHeight = fullHeight * 0.6;

      media.style.height = visibleHeight + 'px';
      video.style.width = width + 'px';
      video.style.height = fullHeight + 'px';
      video.style.transform = 'translateY(-' + (fullHeight * 0.2) + 'px)';
      video.playbackRate = 0.8;
      video.defaultPlaybackRate = 0.8;
    }

    video.addEventListener('loadedmetadata', syncFooterVideo);
    window.addEventListener('resize', syncFooterVideo);
    video.addEventListener('play', function() {
      video.playbackRate = 0.8;
    });

    if (video.readyState >= 1) {
      syncFooterVideo();
    }
  })();
</script>
